name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtk8.6 libtcl8.6

      - name: Install packaging dependencies
        run: python -m pip install -r packaging/requirements-desktop.txt

      - name: Verify Tk
        run: python -c "import tkinter"

      - name: Build native bundle
        run: python tools/build_desktop.py

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: triki-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: packaging/dist/TrikiController-*

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -lh dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Triki Controller ${GITHUB_REF_NAME}" \
            --notes "Native desktop bundles for Linux (x86_64), Windows (x64), and macOS (Apple Silicon). Unpack the whole archive and run TrikiController from that folder. On macOS, open TrikiController.app. These packages are unsigned."
